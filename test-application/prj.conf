# Misc. settings (allow nonsecure logging, enable I2C)
CONFIG_I2C=y
CONFIG_FPU=y
CONFIG_TFM_SECURE_UART=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=y


# Bluetooth settings
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_PRIVACY=n
CONFIG_BT_SIGNING=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_DEVICE_NAME="Arctic_Beacon"

# Logging parameters
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y


